<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our expenses</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#f6f4f0; --card:#fff; --ink:#1d2433; --mute:#6b7280; --line:#e4e0d8; --accent:#2f6f6a; --warn:#b4432f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a22; --card:#1f2430; --ink:#eceff4; --mute:#9aa3b2; --line:#2e3441; --accent:#6fc2b8; --warn:#e58a76; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:24px; margin:8px 0 16px; }
  h2 { font-size:17px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:14px; color:var(--mute); margin:10px 0 3px; }
  input, select, button { font:inherit; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; margin-top:14px; font-weight:bold; }
  button.link { background:none; color:var(--mute); width:auto; margin:0; padding:0; font-weight:normal; text-decoration:underline; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .big { font-size:30px; font-weight:bold; }
  .item { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .item:last-child { border:0; }
  .mute { color:var(--mute); font-size:14px; }
  .err { color:var(--warn); min-height:1.4em; font-size:14px; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>Our expenses</h1>

  <!-- LOGIN -->
  <section id="login" class="card hide">
    <h2>Enter the code</h2>
    <label for="pass">Access code</label><input id="pass" type="password" autocomplete="current-password">
    <button id="loginBtn">Enter</button>
    <p class="err" id="loginErr"></p>
  </section>

  <!-- APP -->
  <div id="app" class="hide">
    <section class="card">
      <div class="row">
        <div><div class="mute">Today</div><div class="big" id="today">0</div></div>
        <div><div class="mute">This month</div><div class="big" id="month">0</div></div>
      </div>
      <div class="mute" id="unit"></div>
      <div class="mute" id="split"></div>
    </section>

    <section class="card">
      <h2>Add expense</h2>
      <div class="row">
        <div><label for="amount">Amount</label><input id="amount" type="number" inputmode="decimal" step="0.01"></div>
        <div><label for="cur">Currency</label>
          <select id="cur"><option>AED</option><option>RUB</option></select></div>
      </div>
      <label for="note">What for</label><input id="note" placeholder="Groceries, taxi, gift...">
      <div class="row">
        <div><label for="cat">Category</label>
          <select id="cat"><option>Food</option><option>Transport</option><option>Home</option><option>Fun</option><option>Gifts</option><option>Other</option></select></div>
        <div><label for="date">Date</label><input id="date" type="date"></div>
      </div>
      <label for="who">Who paid</label><select id="who"></select>
      <button id="addBtn">Save expense</button>
      <p class="err" id="addErr"></p>
    </section>

    <section class="card">
      <h2>Rate: 1 AED in RUB</h2>
      <input id="rate" type="number" step="0.01" inputmode="decimal">
      <div class="mute">Update this when the exchange rate changes. All totals use it.</div>
    </section>

    <section class="card">
      <h2>Recent</h2>
      <div id="list"></div>
    </section>

    <button class="link" id="logoutBtn">Sign out</button>
  </div>
</main>

<script>
/* ===== 1. PUT YOUR SUPABASE VALUES HERE ===== */
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
// The shared account you create in Supabase. Its password IS your access code.
const SHARED_EMAIL = "ourexpenses@example.com";
// Names shown in the "Who paid" list. Change them to your real names.
const PEOPLE = ["Me", "Her"];
/* ============================================ */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let rows = [];

PEOPLE.forEach(n => { const o = document.createElement("option"); o.textContent = n; $("who").appendChild(o); });
try { if (localStorage.getItem("who")) $("who").value = localStorage.getItem("who"); } catch (e) {}
$("who").addEventListener("change", () => { try { localStorage.setItem("who", $("who").value); } catch (e) {} });
$("date").value = new Date().toISOString().slice(0, 10);
$("rate").value = localStorage.getItem("rate") || "22";
$("rate").addEventListener("input", () => { try { localStorage.setItem("rate", $("rate").value); } catch (e) {} render(); });

// Totals are shown in AED. RUB amounts are divided by the rate.
const toAED = r => r.currency === "AED" ? Number(r.amount) : Number(r.amount) / (Number($("rate").value) || 1);
const fmt = n => n.toLocaleString("en", { maximumFractionDigits: 0 });

async function init() {
  const { data } = await db.auth.getSession();
  show(!!data.session);
  if (data.session) load();
}
function show(loggedIn) {
  $("login").classList.toggle("hide", loggedIn);
  $("app").classList.toggle("hide", !loggedIn);
}

$("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("loginBtn").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: SHARED_EMAIL, password: $("pass").value });
  $("loginErr").textContent = error ? "Wrong code." : "";
  if (!error) { show(true); load(); }
};
$("logoutBtn").onclick = async () => { await db.auth.signOut(); show(false); };

async function load() {
  const { data, error } = await db.from("expenses").select("*").order("spent_on", { ascending: false }).order("id", { ascending: false });
  if (error) { $("addErr").textContent = error.message; return; }
  rows = data; render();
}

$("addBtn").onclick = async () => {
  const amount = parseFloat($("amount").value);
  if (!amount || amount <= 0) { $("addErr").textContent = "Enter an amount."; return; }
  const { error } = await db.from("expenses").insert({
    amount, currency: $("cur").value, note: $("note").value, category: $("cat").value,
    spent_on: $("date").value, paid_by: $("who").value
  });
  $("addErr").textContent = error ? error.message : "";
  if (!error) { $("amount").value = ""; $("note").value = ""; load(); }
};

async function del(id) {
  if (!confirm("Delete this expense?")) return;
  await db.from("expenses").delete().eq("id", id); load();
}

function render() {
  const today = new Date().toISOString().slice(0, 10), ym = today.slice(0, 7);
  let t = 0, m = 0; const byPerson = {};
  rows.forEach(r => {
    const v = toAED(r);
    if (r.spent_on === today) t += v;
    if (r.spent_on.startsWith(ym)) { m += v; byPerson[r.paid_by] = (byPerson[r.paid_by] || 0) + v; }
  });
  $("today").textContent = fmt(t); $("month").textContent = fmt(m);
  $("unit").textContent = "AED (RUB converted at your rate)";
  const people = Object.entries(byPerson);
  $("split").textContent = people.map(([p, v]) => p.split("@")[0] + " paid " + fmt(v)).join("  |  ");

  $("list").innerHTML = "";
  rows.slice(0, 30).forEach(r => {
    const d = document.createElement("div"); d.className = "item";
    const left = document.createElement("div");
    left.textContent = (r.note || r.category) + " (" + r.category + ")";
    const sub = document.createElement("div"); sub.className = "mute";
    sub.textContent = r.spent_on + ", " + r.paid_by.split("@")[0];
    left.appendChild(sub);
    const right = document.createElement("div");
    right.textContent = Number(r.amount).toLocaleString("en") + " " + r.currency + " ";
    const x = document.createElement("button"); x.className = "link"; x.textContent = "delete";
    x.onclick = () => del(r.id); right.appendChild(x);
    d.append(left, right); $("list").appendChild(d);
  });
  if (!rows.length) $("list").innerHTML = '<div class="mute">No expenses yet. Add the first one above.</div>';
}
init();
</script>
</body>
</html>
